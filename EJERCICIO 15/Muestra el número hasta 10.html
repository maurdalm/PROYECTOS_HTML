<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muestra el número hasta 10</title>
</head>
<body>
    <h2>Números del 1 al 10</h2>
    <script>
        let x = 1;
        document.write(x + "<br>");
        while (x < 10) {
            x = x + 1;
            document.write(x + "<br>");
        }
    </script>
</body>
</html>
