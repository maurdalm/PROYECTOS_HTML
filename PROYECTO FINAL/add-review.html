<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agregar Reseña</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>

<header>
    <h1>Agregar nueva reseña</h1>
</header>

<section class="add-review-container">

    <input type="text" id="searchDB" placeholder="Buscar título en la base de datos..." onkeyup="searchInDB()" />

    <ul id="searchResults"></ul>

    <!-- 🔥 AQUI SE AGREGA EL CUADRO CON EL RESULTADO SELECCIONADO -->
    <div id="selectedItemBox"></div>
    <!-- 🔥 FIN DE AGREGADO -->

    <h2>Escribe tu reseña</h2>
    <div class="review-writer">
        
        <textarea id="reviewText" placeholder="Escribe tu reseña aquí..."></textarea>

        <button type="button" onclick="saveReview()" class="btn-primary">Guardar reseña</button>
    </div>
</section>

<footer>
    © 2025 Proyecto final de Mauricio Alberto Daleman Mahecha. Todos los derechos reservados.
</footer>
<script src="app.js"></script>
</body>
</html>
