<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formulario Completo y Validación JS para Estudiantes</title>
<style>
/* Estilos básicos para hacerlo más legible */
body { font-family: Arial, sans-serif; padding: 20px; background-color: #f4f4f4; }
.contenedor { max-width: 600px; margin: auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 0 10px rgba(0, 0, 0, 0.1); }
.grupo-control { margin-bottom: 15px; }
label { display: block; margin-bottom: 5px; font-weight: bold; }
input[type="text"], input[type="email"], input[type="password"], input[type="number"], textarea, select, datalist {
width: 100%;
padding: 10px;
border: 1px solid #ccc;
border-radius: 4px;
box-sizing: border-box; /* Incluye padding y borde en el ancho total */
}
input:invalid:not(:placeholder-shown), select:invalid:not([value=""]):not(:placeholder-shown) { border-color: red; }
.error { color: red; font-size: 0.9em; margin-top: 5px; }
fieldset { border: 1px solid #ccc; padding: 10px; margin-bottom: 20px; }
legend { font-weight: bold; padding: 0 10px; }
button { background-color: #007bff; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; }
button:hover { background-color: #0056b3; }
</style>
</head>
<body>
<div class="contenedor">
<h1>Ejemplo de Formulario HTML Completo</h1>
<p>Este formulario incluye las etiquetas más comunes y validación con JavaScript.</p>
<form id="registroForm" action="/procesar-datos" method="post" novalidate>
<fieldset>
<legend>Datos Personales</legend>
<div class="grupo-control">
<label for="nombre">Nombre Completo:</label>
<input type="text" id="nombre" name="nombre" placeholder="Ingresa tu nombre" required minlength="3">
<div class="error" id="errorNombre"></div>
</div>
<div class="grupo-control">
<label for="email">Correo Electrónico:</label>
<input type="email" id="email" name="email" placeholder="ejemplo@dominio.com" required>
<div class="error" id="errorEmail"></div>
</div>
<div class="grupo-control">
<label for="password">Contraseña:</label>
<input type="password" id="password" name="password" required minlength="6">
<div class="error" id="errorPassword"></div>
</div>
<div class="grupo-control">
<label for="edad">Edad (type="number"):</label>
<input type="number" id="edad" name="edad" min="18" max="99" value="25">
</div>
</fieldset>
<fieldset>
<legend>Opciones y Selecciones</legend>
<div class="grupo-control">
<p>Tipo de Usuario:</p>
<input type="radio" id="estudiante" name="tipo_usuario" value="estudiante" checked>
<label for="estudiante">Estudiante</label>
<input type="radio" id="profesor" name="tipo_usuario" value="profesor">
<label for="profesor">Profesor</label>
</div>
<div class="grupo-control">
<p>Intereses:</p>
<input type="checkbox" id="html_c" name="intereses" value="html">
<label for="html_c">HTML</label><br>
<input type="checkbox" id="css_c" name="intereses" value="css">
<label for="css_c">CSS</label><br>
<input type="checkbox" id="js_c" name="intereses" value="javascript">
<label for="js_c">JavaScript</label>
</div>
<div class="grupo-control">
<label for="ciudad">Ciudad de Residencia:</label>
<select id="ciudad" name="ciudad" required>
<option value="">-- Seleccione una opción --</option> <optgroup label="Europa">
<option value="madrid">Madrid</option>
<option value="paris">París</option>
</optgroup>
<optgroup label="América">
<option value="bogota">Bogotá</option>
<option value="mexico_df">Ciudad de México</option>
</optgroup>
</select>
<div class="error" id="errorCiudad"></div>
</div>
<div class="grupo-control">
<label for="tecnologia">Tecnología Favorita (Sugerencia con Datalist):</label>
<input type="text" id="tecnologia" name="tecnologia" list="lista-tecnologias" placeholder="Escribe o selecciona">
<datalist id="lista-tecnologias">
<option value="React"></option>
<option value="Vue"></option>
<option value="Angular"></option>
<option value="Node.js"></option>
</datalist>
</div>
</fieldset>
<fieldset>
<legend>Comentarios</legend>
<div class="grupo-control">
<label for="comentarios">Comentarios Adicionales:</label>
<textarea id="comentarios" name="comentarios" rows="4" placeholder="Máximo 200 caracteres..." maxlength="200"></textarea>
</div>
<div class="grupo-control">
<label for="archivo">Subir Archivo (type="file"):</label>
<input type="file" id="archivo" name="archivo">
</div>
</fieldset>
<button type="submit">Enviar Formulario</button>
<button type="reset">Limpiar</button>
<input type="hidden" name="fecha_envio" value="">
</form>
</div>
<script src="form.js"></script>
</body>
</html>
