<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Anuario Talento Tech</title>

  <!-- Vincular CSS -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header>
    <h1>Anuario — Talento Tech</h1>
    <div class="controls">
      <input class="search" id="search" placeholder="Buscar por nombre o proyecto" aria-label="Buscar compañeros" />
      <select id="filter" title="Filtrar">
        <option value="">Todos</option>
        <option value="frontend">Frontend</option>
        <option value="backend">Backend</option>
        <option value="fullstack">Fullstack</option>
      </select>
      <button class="btn" id="themeToggle" title="Cambiar tema">Tema</button>
    </div>
  </header>

  <main>
    <section class="grid" id="grid" aria-live="polite"></section>
  </main>

  <footer>
    <small class="muted">© 2025 Talento Tech — Anuario Digital Interactivo</small>
  </footer>

  <!-- Modal de perfil -->
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-hidden="true">
    <article class="profile" role="document">
      <div class="profile-header">
        <div class="head">
          <img id="p-avatar" src="" alt="Foto de perfil">
          <div class="info">
            <h2 id="p-name"></h2>
            <p id="p-lema" class="muted"></p>
            <p id="p-bio"></p>
          </div>
        </div>
        <button id="close" class="btn">Cerrar</button>
      </div>

      <div class="section">
        <h3>Logros</h3>
        <ul id="p-logros"></ul>
      </div>

      <div class="section">
        <h3>Proyectos</h3>
        <ul id="p-proyectos"></ul>
      </div>

      <div class="section">
        <h3>Galería</h3>
        <div class="gallery" id="p-gallery" aria-label="Galería de fotos"></div>
      </div>

      <div class="section" id="mediaSection">
        <h3>Multimedia</h3>
        <div id="p-video"></div>
        <div id="p-audio" class="audio"></div>
      </div>
    </article>
  </div>

  <!-- Lightbox (para ampliar imágenes) -->
  <div class="lightbox" id="lightbox" role="dialog" aria-hidden="true">
    <img id="lightboxImg" alt="Imagen ampliada">
  </div>

  <!-- Vincular JS -->
  <script src="script.js"></script>
</body>
</html>
